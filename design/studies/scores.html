<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score study</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../lib/glass.css">
<link rel="stylesheet" href="../lib/controls.css">
<link rel="stylesheet" href="../lib/evaluation.css">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--surface-chart); color: var(--ink-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.chrome { position: fixed; z-index: 50; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
.chrome > * { pointer-events: auto; }
.chrome.top { top: 16px; } .chrome.bottom { bottom: 16px; justify-content: center; }
.c-pill { text-decoration: none; color: inherit; }
#ev { padding: 96px 40px 160px; max-width: 1480px; margin: 0 auto; }
</style>
</head>
<body>
<div class="chrome top">
  <a class="c-pill icon" id="back" href="../index.html" aria-label="Back to the design system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <button class="c-pill icon" id="theme" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
</div>
<div class="chrome bottom"><div id="t-rows"></div></div>
<main id="ev"></main>
<script type="module" src="scores.js"></script>
</body>
</html>
