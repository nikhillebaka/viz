apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-viz
  annotations:
    # Allow compressed folder uploads up to 105 MB
    nginx.ingress.kubernetes.io/proxy-body-size: "105m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Optional SSO sidecar / oauth2-proxy annotations (enable VIZ_TRUST_PROXY_AUTH=1 on deployment):
    # nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
    # nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
spec:
  rules:
    - host: hub.viz.example.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub-viz
                port:
                  number: 80
